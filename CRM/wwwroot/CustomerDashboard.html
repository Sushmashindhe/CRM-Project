<!DOCTYPE html>
<html>
<head>
    <title>Customer Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", sans-serif;
        }

        .dashboard-header {
            background: #1f2937;
            color: white;
            padding: 18px;
            border-radius: 8px;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .btn-primary {
            background: #2563eb;
            border: none;
        }

        .table th {
            background: #374151;
            color: white;
        }

        .badge {
            padding: 5px 8px;
        }

        .bg-warning {
            background-color: #f59e0b !important;
        }

        .bg-success {
            background-color: #10b981 !important;
        }

        .bg-danger {
            background-color: #ef4444 !important;
        }
    </style>
</head>

<body class="container py-4">

    <!-- HEADER -->
    <div class="dashboard-header d-flex justify-content-between mb-4">
        <h3><i class="bi bi-person-circle"></i> Customer Dashboard</h3>
        <button onclick="logout()" class="btn btn-light">Logout</button>
    </div>

    <!-- STATS -->
    <div class="row mb-4">
        <div class="col-md-4"><div class="card p-3 text-center"><h6>Total</h6><h3 id="totalReq">0</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center"><h6>Pending</h6><h3 id="pendingReq">0</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center"><h6>Completed</h6><h3 id="completedReq">0</h3></div></div>
    </div>

    <!-- PROFILE -->
    <div class="card p-4 mb-4">
        <h4>Your Details</h4>
        <p><b>Name:</b> <span id="cname"></span></p>
        <p><b>Email:</b> <span id="cemail"></span></p>
        <p><b>Phone:</b> <span id="cphone"></span></p>
    </div>

    <!-- SEND -->
    <div class="card p-4 mb-4">
        <h4>Send Requirement</h4>

        <input id="title" class="form-control mb-2" placeholder="Title">
        <textarea id="desc" class="form-control mb-2" placeholder="Description"></textarea>

        <select id="category" class="form-select mb-2">
            <option value="">Select Category</option>
            <option value="IT">IT</option>
            <option value="NonIT">Non IT</option>
        </select>

        <button onclick="sendRequirement()" class="btn btn-primary">Submit</button>
    </div>

    <!-- TABLE -->
    <div class="card p-4">
        <h4>Your Requirements</h4>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="reqTable"></tbody>
        </table>
    </div>

    <script>
        const API = "https://localhost:7192";

        // ✅ WAIT UNTIL PAGE LOADS
        document.addEventListener("DOMContentLoaded", function () {

            const session = JSON.parse(localStorage.getItem("user"));

            if (!session) {
                alert("Please login first");
                window.location.href = "CustomerLogin.html";
                return;
            }

            // ✅ Extract actual user
            const user = session.user;

            // ✅ Display user details
            document.getElementById("cname").innerText = user.name;
            document.getElementById("cemail").innerText = user.email;
            document.getElementById("cphone").innerText = user.phone;

            // ✅ Load data
            loadRequirements(user.id);
        });


        // ✅ SEND REQUIREMENT
        async function sendRequirement() {

            const session = JSON.parse(localStorage.getItem("user"));
            const user = session.user;

            const req = {
                Title: document.getElementById("title").value,
                Description: document.getElementById("desc").value,
                Category: document.getElementById("category").value,
                CustomerId: user.id,
                Status: "Pending",
                AssignedTo: "Admin"
            };

            if (!req.Title || !req.Description || !req.Category) {
                alert("Fill all fields");
                return;
            }

            try {
                const res = await fetch(API + "/api/customerrequirements", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(req)
                });

                if (res.ok) {
                    alert("Submitted!");

                    document.getElementById("title").value = "";
                    document.getElementById("desc").value = "";
                    document.getElementById("category").value = "";

                    loadRequirements(user.id);
                } else {
                    const err = await res.text();
                    alert("Error: " + err);
                }

            } catch (err) {
                alert("Server error");
                console.error(err);
            }
        }


        // ✅ LOAD REQUIREMENTS
        async function loadRequirements(customerId) {

            try {
                const res = await fetch(API + "/api/customerrequirements/my/" + customerId);
                const data = await res.json();

                let html = "";

                let total = data.length;
                let pending = data.filter(r => r.status === "Pending").length;
                let completed = data.filter(r => r.status === "Completed").length;

                data.forEach(r => {

                    let badge = "bg-warning";

                    if (r.status === "Completed") badge = "bg-success";
                    if (r.status === "Rejected") badge = "bg-danger";

                    html += `
                    <tr>
                        <td>${r.title}</td>
                        <td>${r.description}</td>
                        <td>${r.category}</td>
                        <td><span class="badge ${badge}">${r.status}</span></td>
                    </tr>
                `;
                });

                document.getElementById("reqTable").innerHTML = html;

                document.getElementById("totalReq").innerText = total;
                document.getElementById("pendingReq").innerText = pending;
                document.getElementById("completedReq").innerText = completed;

            } catch (err) {
                alert("Error loading data");
                console.error(err);
            }
        }


        // ✅ LOGOUT
        function logout() {
            localStorage.removeItem("user");
            window.location.href = "CustomerLogin.html";
        }
    </script>

</body>
</html>
