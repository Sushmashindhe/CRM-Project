<!DOCTYPE html>
<html>
<head>
    <title>Customer Dashboard</title><!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", sans-serif;
            color: #2c3e50;
        }
        /* HEADER */ .dashboard-header {
            background: #1f2937; /* dark professional */
            color: white;
            padding: 18px;
            border-radius: 8px;
        }
        /* CARDS */ .card {
            border: none;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        /* INPUTS */ .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #d1d5db;
        }

            .form-control:focus, .form-select:focus {
                border-color: #2563eb;
                box-shadow: none;
            }
        /* BUTTON */ .btn-primary {
            background: #2563eb;
            border: none;
            border-radius: 6px;
        }

            .btn-primary:hover {
                background: #1e40af;
            }
        /* TABLE */ .table th {
            background: #374151;
            color: white;
        }

        .table tbody tr:hover {
            background: #f9fafb;
        }
        /* BADGES */ .badge {
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
        }
        /* STATUS COLORS */ .bg-warning {
            background-color: #f59e0b !important;
        }

        .bg-success {
            background-color: #10b981 !important;
        }

        .bg-danger {
            background-color: #ef4444 !important;
        }
    </style>
</head>
<body class="container py-4">
    <!-- Header --><div class="dashboard-header d-flex justify-content-between align-items-center mb-4">
        <h3><i class="bi bi-person-circle"></i> Customer Dashboard</h3><button onclick="logout()" class="btn btn-light">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </div><div class="row mb-4"><div class="col-md-4"><div class="card p-3 text-center"><h6>Total Requirements</h6><h3 id="totalReq">0</h3></div></div><div class="col-md-4"><div class="card p-3 text-center"><h6>Pending</h6><h3 id="pendingReq">0</h3></div></div><div class="col-md-4"><div class="card p-3 text-center"><h6>Completed</h6><h3 id="completedReq">0</h3></div></div></div><!-- Customer Profile --><div class="card p-4 mb-4"><h4 class="mb-3"><i class="bi bi-person"></i> Your Details</h4><div class="row"><div class="col-md-4"><p><b>Name:</b> <span id="cname"></span></p></div><div class="col-md-4"><p><b>Email:</b> <span id="cemail"></span></p></div><div class="col-md-4"><p><b>Phone:</b> <span id="cphone"></span></p></div></div></div><!-- Send Requirement --><div class="card p-4 mb-4"><h4 class="mb-3"><i class="bi bi-send"></i> Send Requirement</h4><div class="row g-3"><div class="col-md-6"><input id="title" class="form-control" placeholder="Requirement Title"></div><div class="col-md-6"><select id="category" class="form-select"><option value="">Select Category</option><option value="IT">IT</option><option value="NonIT">Non IT</option></select></div><div class="col-12"><textarea id="desc" class="form-control" rows="3" placeholder="Description"></textarea></div><div class="col-md-3"><button onclick="sendRequirement()" class="btn btn-primary w-100">                    Submit                </button></div></div></div><!-- Requirement List --><div class="card p-4"><h4 class="mb-3"><i class="bi bi-list-check"></i> Your Requirements</h4><table class="table table-hover table-bordered"><thead class="table-primary"><tr><th>Title</th><th>Description</th><th>Category</th><th>Status</th></tr></thead><tbody id="reqTable"></tbody></table></div>
    <script>
    const API = "https://localhost:7192";

        // Get logged-in userconst user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            window.location.href = "CustomerLogin.html";
        }
        // Display user detailsdocument.getElementById("cname").innerText = user.name;
        document.getElementById("cemail").innerText = user.email;
        document.getElementById("cphone").innerText = user.phone;

        // Send requirementasync function sendRequirement() {

        const req = {
            title: document.getElementById("title").value,
            description: document.getElementById("desc").value,
            category: document.getElementById("category").value,
            customerId: user.id,
            status: "Pending"
        };
        if (!req.title || !req.description || !req.category) {
            alert("Please fill all fields.");
            return;
        }
        try {

            const res = await fetch(API + "/api/customerrequirements", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }, body: JSON.stringify(req)
            });
            if (res.ok) {

                alert("Requirement sent successfully!");

                document.getElementById("title").value = "";
                document.getElementById("desc").value = "";
                document.getElementById("category").value = "";

                loadRequirements();
            } else {
                const err = await res.text();
                alert("Failed: " + err);
            }
        } catch (error) {
            alert("Server Error: " + error.message);
        }
            }
        // Load requirementsasync function loadRequirements() {

        try {

            const res = await fetch(API + "/api/customerrequirements/my/" + user.id);
            const data = await res.json();

            let html = "";

            let total = data.length;
            let pending = data.filter(r => r.status === "Pending").length;
            let completed = data.filter(r => r.status === "Completed").length;

            data.forEach(r => {

                let badgeClass = "bg-warning text-dark";

                if (r.status === "Completed") badgeClass = "bg-success";
                if (r.status === "Rejected") badgeClass = "bg-danger";

                html += `
<tr>
<td>${r.title}</td>
<td>${r.description}</td>
<td>${r.category}</td>
<td><span class="badge ${badgeClass}">${r.status}</span></td>
</tr>
`;

            });

            document.getElementById("reqTable").innerHTML = html;

            // ✅ Update statsdocument.getElementById("totalReq").innerText = total;
            document.getElementById("pendingReq").innerText = pending;
            document.getElementById("completedReq").innerText = completed;

        } catch (error) {

            alert("Error loading requirements");

        }

            }

        // Logoutfunction logout() {

        localStorage.removeItem("user");

        window.location.href = "CustomerLogin.html";

            }

        loadRequirements();

    </script>
</body>
</html>
