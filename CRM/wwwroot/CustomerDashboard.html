<!DOCTYPE html>
<html>
<head>
    <title>Customer Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/CustomerDashboard.css">
</head>

<body class="container py-4">

    <!-- HEADER -->
    <div class="dashboard-header d-flex justify-content-between mb-4">
        <h3><i class="bi bi-person-circle"></i> Customer Dashboard</h3>
        <button onclick="logout()" class="btn btn-light">Logout</button>
    </div>

    <!-- STATS -->
    <div class="row mb-4">
        <div class="col-md-4"><div class="card p-3 text-center"><h6>Total</h6><h3 id="totalReq">0</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center"><h6>Pending</h6><h3 id="pendingReq">0</h3></div></div>
        <div class="col-md-4"><div class="card p-3 text-center"><h6>Completed</h6><h3 id="completedReq">0</h3></div></div>
    </div>

    <!-- PROFILE -->
    <div class="card p-4 mb-4">
        <h4>Your Details</h4>
        <p><b>Name:</b> <span id="cname"></span></p>
        <p><b>Email:</b> <span id="cemail"></span></p>
        <p><b>Phone:</b> <span id="cphone"></span></p>
    </div>

    <!-- SEND -->
    <div class="card p-4 mb-4">
        <h4>Send Requirement</h4>

        <input id="title" class="form-control mb-2" placeholder="Title">
        <textarea id="desc" class="form-control mb-2" placeholder="Description"></textarea>

        <select id="category" class="form-select mb-2">
            <option value="">Select Category</option>
            <option value="IT">IT</option>
            <option value="NonIT">Non IT</option>
        </select>

        <button onclick="sendRequirement()" class="btn btn-primary">Submit</button>
    </div>

    <!-- TABLE -->
    <div class="card p-4">
        <h4>Your Requirements</h4>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="reqTable"></tbody>
        </table>
    </div>
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert">
            <div class="d-flex">
                <div id="toastMessage" class="toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="/js/CustomerDashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
