<!DOCTYPE html>
<html>

<head>
    <title>Customer Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .dashboard-header {
            background: linear-gradient(90deg, #007bff, #00c6ff);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
        }

            .card h4 {
                font-weight: 600;
            }

        .btn-primary {
            background: #007bff;
            border: none;
        }

            .btn-primary:hover {
                background: #0056b3;
            }

        table tbody tr:hover {
            background: #f1f7ff;
        }
    </style>
</head>

<body class="container py-4">

    <!-- Header -->
    <div class="dashboard-header d-flex justify-content-between align-items-center mb-4">
        <h3><i class="bi bi-person-circle"></i> Customer Dashboard</h3>
        <button onclick="logout()" class="btn btn-light">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </div>

    <!-- Customer Profile -->
    <div class="card p-4 mb-4">
        <h4 class="mb-3"><i class="bi bi-person"></i> Your Details</h4>
        <div class="row">
            <div class="col-md-4">
                <p><b>Name:</b> <span id="cname"></span></p>
            </div>
            <div class="col-md-4">
                <p><b>Email:</b> <span id="cemail"></span></p>
            </div>
            <div class="col-md-4">
                <p><b>Phone:</b> <span id="cphone"></span></p>
            </div>
        </div>
    </div>

    <!-- Send Requirement -->
    <div class="card p-4 mb-4">
        <h4 class="mb-3"><i class="bi bi-send"></i> Send Requirement</h4>

        <div class="row">
            <div class="col-md-6">
                <input id="title" class="form-control mb-3" placeholder="Requirement Title">
            </div>

            <div class="col-md-6">
                <select id="category" class="form-control mb-3">
                    <option value="">Select Category</option>
                    <option value="IT">IT</option>
                    <option value="NonIT">Non IT</option>
                </select>
            </div>
        </div>

        <textarea id="desc" class="form-control mb-3" placeholder="Description"></textarea>

        <button onclick="sendRequirement()" class="btn btn-primary">
            <i class="bi bi-send-fill"></i> Submit Requirement
        </button>
    </div>

    <!-- Requirement List -->
    <div class="card p-4">
        <h4 class="mb-3"><i class="bi bi-list-check"></i> Your Requirements</h4>

        <table class="table table-hover table-bordered">
            <thead class="table-primary">
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="reqTable"></tbody>
        </table>
    </div>


    <script>

        const API = "https://localhost:7192";

        // Get logged-in user
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            window.location.href = "CustomerLogin.html";
        }

        // Display user details
        document.getElementById("cname").innerText = user.name;
        document.getElementById("cemail").innerText = user.email;
        document.getElementById("cphone").innerText = user.phone;

        // Send requirement
        async function sendRequirement() {

            const req = {
                title: document.getElementById("title").value,
                description: document.getElementById("desc").value,
                category: document.getElementById("category").value,
                customerId: user.id,
                status: "Pending"
            };

            if (!req.title || !req.description || !req.category) {
                alert("Please fill all fields.");
                return;
            }

            try {

                const res = await fetch(API + "/api/customerrequirements", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(req)
                });

                if (res.ok) {

                    alert("Requirement sent successfully!");

                    document.getElementById("title").value = "";
                    document.getElementById("desc").value = "";
                    document.getElementById("category").value = "";

                    loadRequirements();
                }
                else {
                    const err = await res.text();
                    alert("Failed: " + err);
                }

            } catch (error) {
                alert("Server Error: " + error.message);
            }

        }

        // Load requirements
        async function loadRequirements() {

            try {

                const res = await fetch(API + "/api/customerrequirements/my/" + user.id);

                const data = await res.json();

                let html = "";

                data.forEach(r => {

                    html += `
<tr>
<td>${r.title}</td>
<td>${r.description}</td>
<td>${r.category}</td>
<td>
<span class="badge bg-warning text-dark">${r.status}</span>
</td>
</tr>
`;

                });

                document.getElementById("reqTable").innerHTML = html;

            } catch (error) {

                alert("Error loading requirements");

            }

        }

        // Logout
        function logout() {

            localStorage.removeItem("user");

            window.location.href = "CustomerLogin.html";

        }

        loadRequirements();

    </script>

</body>
</html>
