<!DOCTYPE html>
<html>

<head>
    <title>Customer Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>Customer Registration</h2>

    <input id="name" class="form-control mb-2" placeholder="Name">

    <input id="email" class="form-control mb-2" placeholder="Email">

    <input id="password" type="password" class="form-control mb-2" placeholder="Password">

    <input id="phone" class="form-control mb-2" placeholder="Phone">

    <button onclick="register()" class="btn btn-primary">
        Register
    </button>

    <p class="mt-3">
        Already registered?
        <a href="CustomerLogin.html">Login here</a>
    </p>

    <script>

async function register(){

const customer = {

name: document.getElementById("name").value,
email: document.getElementById("email").value,
password: document.getElementById("password").value,
phone: document.getElementById("phone").value

};

const res = await fetch("/api/customers/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(customer)

});

if(res.ok){
alert("Registration successful");
window.location.href="CustomerLogin.html";
}else{
alert("Registration failed");
}

}

    </script>

</body>
</html>
