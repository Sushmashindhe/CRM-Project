<!DOCTYPE html>
<html>

<head>

    <title>Customer Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
            font-family: Arial,Helvetica,sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 35px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

            .logo h2 {
                font-weight: bold;
                color: #1a78b4;
            }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 18px;
        }

        .btn-register {
            background: #2d6cdf;
            border: none;
        }

            .btn-register:hover {
                background: #1e54b8;
            }

        .help-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .error-text {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .success-text {
            color: green;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            <h2>CRM</h2>
        </div>

        <div class="login-title">Customer Registration</div>

        <!-- NAME -->

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input id="name" class="form-control">
        </div>

        <!-- EMAIL -->

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" class="form-control">
        </div>

        <!-- PASSWORD -->

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control">
        </div>

        <!-- PHONE -->

        <div class="mb-3">
            <label class="form-label">Phone</label>

            <input id="phone" class="form-control" maxlength="10">

            <div id="phoneError" class="error-text">
                Phone number must be exactly 10 digits
            </div>

        </div>

        <!-- REGISTER BUTTON -->

        <div class="d-grid">
            <button onclick="register()" class="btn btn-register text-white">
                Register
            </button>
        </div>

        <!-- SUCCESS / ERROR MESSAGE -->

        <div id="successMsg" class="success-text">
            Registration successful
        </div>

        <div id="failMsg" class="error-text">
            Registration failed. Please try again.
        </div>

        <div class="help-link">
            Already registered?
            <a href="CustomerLogin.html">Login here</a>
        </div>

    </div>

    <script>

        async function register() {

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const phone = document.getElementById("phone").value.trim();

            const phoneError = document.getElementById("phoneError");
            const successMsg = document.getElementById("successMsg");
            const failMsg = document.getElementById("failMsg");

            phoneError.style.display = "none";
            successMsg.style.display = "none";
            failMsg.style.display = "none";

            /* PHONE VALIDATION */

            const phonePattern = /^\d{10}$/;

            if (!phonePattern.test(phone)) {
                phoneError.style.display = "block";
                return;
            }

            const customer = {

                name: name,
                email: email,
                password: password,
                phone: phone

            };

            const res = await fetch("/api/customers/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(customer)

            });

            if (res.ok) {

                successMsg.style.display = "block";

                setTimeout(() => {
                    window.location.href = "CustomerLogin.html";
                }, 1500);

            } else {

                failMsg.style.display = "block";

            }

        }

    </script>

</body>
</html>
