<!DOCTYPE html>
<html>

<head>

    <title>Customer Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/EmployeeDashboard.css">
    <link rel="stylesheet" href="/css/CustomerRegister.css">


</head>

<body>

    <div class="login-card">

        <div class="logo">
            <h2>CRM</h2>
        </div>

        <div class="login-title">Customer Registration</div>

        <!-- NAME -->

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input id="name" class="form-control">
        </div>

        <!-- EMAIL -->

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" class="form-control">
        </div>

        <!-- PASSWORD -->

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control">
        </div>
        <div id="passwordError" class="error-text">
            Password must be at least 8 characters, include uppercase, lowercase, number, and special character
        </div>

        <!-- PHONE -->

        <div class="mb-3">
            <label class="form-label">Phone</label>

            <input id="phone" class="form-control" maxlength="10">

            <div id="phoneError" class="error-text">
                Phone number must be exactly 10 digits
            </div>

        </div>

        <!-- REGISTER BUTTON -->

        <div class="d-grid">
            <button onclick="register()" class="btn btn-register text-white">
                Register
            </button>
        </div>

        <!-- SUCCESS / ERROR MESSAGE -->

        <div id="successMsg" class="success-text">
            Registration successful
        </div>

        <div id="failMsg" class="error-text">
            Registration failed. Please try again.
        </div>

        <div class="help-link">
            Already registered?
            <a href="CustomerLogin.html">Login here</a>
        </div>

    </div>

    <script src="/js/CustomerRegister.js"></script>

</body>
</html>
