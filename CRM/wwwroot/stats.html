<!DOCTYPE html>
<html>

<head>
    <title>Stats Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas.pie-chart {
            max-width: 60% !important; /* shrink width */
            height: 350px !important; /* reasonable height */
            margin: 0 auto 40px auto; /* center and add spacing */
            display: block;
        }

        canvas.bar-chart {
            max-width: 80% !important; /* wider than pie charts */
            height: 400px !important; /* taller for better readability */
            margin: 0 auto 40px auto; /* center with spacing */
            display: block;
        }
    </style>
</head>

<body class="container mt-4">


    <h2 class="mb-4">📊 Stats Dashboard</h2>
    <button onclick="goBack()" class="btn btn-secondary mb-4">⬅ Back</button>

    <h4>Total Requirements Overview</h4>
    <canvas id="totalReqChart" class="pie-chart"></canvas>

    <h4>Total Overview (Managers vs Employees)</h4>
    <canvas id="totalChart" class="pie-chart"></canvas>

    <h4>Employees per Manager</h4>
    <canvas id="empManagerChart" class="bar-chart"></canvas>

    <h4>Employee Types</h4>
    <canvas id="roleChart" class="bar-chart"></canvas>

    <button onclick="loadAll()" class="btn btn-primary mb-5">🔄 Refresh Stats</button>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }

        let totalReqChart, totalChart, empManagerChart, roleChart;

        // ================= TOTAL REQUIREMENTS =================
        async function loadRequirementsPie() {
            const res = await fetch("https://localhost:7192/api/customerrequirements/stats");
            const data = await res.json();

            const labels = data.map(x => x.status);
            const counts = data.map(x => x.count);

            if (totalReqChart) totalReqChart.destroy();

            totalReqChart = new Chart(document.getElementById("totalReqChart"), {
                type: 'pie',
                data: {
                    labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }, // moved from right
                        title: { display: true, text: 'Total Requirements Overview', font: { size: 20 } }
                    }

                }
            });
        }

        // ================= TOTAL OVERVIEW =================
        async function loadTotals() {
            const managerRes = await fetch("https://localhost:7192/api/employees/total-managers");
            const employeeRes = await fetch("https://localhost:7192/api/emp/total-employees");

            const managers = await managerRes.json();
            const employees = await employeeRes.json();

            if (totalChart) totalChart.destroy();

            totalChart = new Chart(document.getElementById("totalChart"), {
                type: 'doughnut',
                data: {
                    labels: ["Managers", "Employees"],
                    datasets: [{
                        data: [managers, employees],
                        backgroundColor: ['#4BC0C0', '#FF6384'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }, // moved from right
                        title: { display: true, text: 'Total Requirements Overview', font: { size: 20 } }
                    }

                }
            });
        }

        // ================= EMPLOYEES PER MANAGER =================
        async function loadEmpPerManager() {
            const res = await fetch("https://localhost:7192/api/employees/manager-count");
            const data = await res.json();

            const labels = data.map(x => x.managerName);
            const counts = data.map(x => x.count);

            if (empManagerChart) empManagerChart.destroy();

            empManagerChart = new Chart(document.getElementById("empManagerChart"), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: "Employees",
                        data: counts,
                        backgroundColor: '#FF9F40',
                        borderColor: '#FF6F00',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: "Employees per Manager", font: { size: 20 } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } },
                        x: { ticks: { maxRotation: 45, minRotation: 0 } }
                    }
                }
            });
        }

        // ================= EMPLOYEE TYPES =================
        async function loadEmployeeTypes() {
            const res = await fetch("https://localhost:7192/api/emp/employee-types");
            const data = await res.json();

            const labels = data.map(x => x.role);
            const counts = data.map(x => x.count);

            if (roleChart) roleChart.destroy();

            roleChart = new Chart(document.getElementById("roleChart"), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: "Employees",
                        data: counts,
                        backgroundColor: ['#36A2EB', '#FF6384', '#FFCE56', '#4BC0C0'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: "Employee Types", font: { size: 20 } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } },
                        x: { ticks: { maxRotation: 45, minRotation: 0 } }
                    }
                }
            });
        }

        // ================= LOAD ALL =================
        function loadAll() {
            loadRequirementsPie();
            loadTotals();
            loadEmployeeTypes();
            loadEmpPerManager();
        }

        loadAll();
    </script>

</body>
</html>
