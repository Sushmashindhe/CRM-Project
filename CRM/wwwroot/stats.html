<!DOCTYPE html>
<html>

<head>
    <title>Stats Dashboard</title>

    <!-- Bootstrap (optional but nice UI) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="container mt-4">

    <h2>📊 Stats Dashboard</h2>

    <button onclick="goBack()" class="btn btn-secondary mb-3">⬅ Back</button>

    <h4>Status Bar Chart</h4>
    <canvas id="barChart"></canvas>

    <h4 class="mt-5">Status Pie Chart</h4>
    <canvas id="pieChart"></canvas>

    <h4>Total Overview</h4>
    <canvas id="totalChart"></canvas>

    <h4 class="mt-5">Employees per Manager</h4>
    <canvas id="empManagerChart"></canvas>

    <h4>Employee Types</h4>
    <canvas id="roleChart"></canvas>

    <button onclick="loadAll()" class="btn btn-primary mb-3">
        🔄 Refresh Stats
    </button>

    <script>

        function goBack() {
            window.location.href = "index.html";
        }

        // ✅ Declare ONLY ONCE
        let barChart, pieChart, totalChart, roleChart;

        // ================= STATUS =================
        async function loadCharts() {
            const res = await fetch("https://localhost:7192/api/customerrequirements/stats", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            });

            const data = await res.json();

            const labels = data.map(x => x.status);
            const counts = data.map(x => x.count);

            if (barChart) barChart.destroy();
            if (pieChart) pieChart.destroy();

            barChart = new Chart(document.getElementById("barChart"), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Requests',
                        data: counts,
                        backgroundColor: ['blue', 'green', 'orange', 'red']
                    }]
                }
            });

            pieChart = new Chart(document.getElementById("pieChart"), {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: ['blue', 'green', 'orange', 'red']
                    }]
                }
            });
        }

        // ================= TOTAL =================
        async function loadTotals() {
            const managerRes = await fetch("https://localhost:7192/api/employees/manager-count", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            });

            const employeeRes = await fetch("https://localhost:7192/api/emp/employee-count", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            });

            const managers = await managerRes.json();
            const employees = await employeeRes.json();

            if (totalChart) totalChart.destroy();

            totalChart = new Chart(document.getElementById("totalChart"), {
                type: 'doughnut',
                data: {
                    labels: ["Managers", "Employees"],
                    datasets: [{
                        data: [managers, employees],
                        backgroundColor: ["blue", "green"]
                    }]
                }
            });
        }

        // ================= EMPLOYEE TYPES =================
        async function loadEmployeeTypes() {
            const res = await fetch("https://localhost:7192/api/emp/employee-types", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            });

            const data = await res.json();

            const labels = data.map(x => x.role);
            const counts = data.map(x => x.count);

            if (roleChart) roleChart.destroy();

            roleChart = new Chart(document.getElementById("roleChart"), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Employees",
                        data: counts,
                        backgroundColor: "blue"
                    }]
                }
            });
        }

        // ================= LOAD ALL =================
        function loadAll() {
            loadCharts();
            loadTotals();
            loadEmployeeTypes();
        }

        // Initial load
        loadAll();


    </script>

</body>

</html>
