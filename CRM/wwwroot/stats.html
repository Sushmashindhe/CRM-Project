<!DOCTYPE html>
<html>

<head>
    <title>Stats Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f4f8fb;
            font-family: 'Segoe UI';
            transition: 0.3s;
        }

        /* DARK MODE */
        .dark-mode {
            background: #1e293b;
            color: white;
        }

            .dark-mode .card-box,
            .dark-mode .kpi-card {
                background: #334155;
                color: white;
            }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: linear-gradient(135deg, #3A9DD2, #00AD82);
            color: white;
            padding: 18px 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 25px;
        }

        /* FOOTER */
        .footer {
            position: sticky;
            bottom: 0;
            z-index: 1000;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            background: #f8f9fa;
            color: #777;
            font-size: 14px;
        }

        /* CARDS */
        .card-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

            .card-box:hover {
                transform: translateY(-4px);
            }

        h4 {
            color: #3A9DD2;
            font-weight: 600;
            margin-bottom: 15px;
        }

        canvas {
            display: block;
            margin: auto;
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #00AD82, #3A9DD2);
            border: none;
            border-radius: 10px;
        }

        .btn-light,
        .btn-dark {
            border-radius: 10px;
        }
    </style>
</head>

<body class="py-4">

    <div class="container">

        <!-- HEADER -->
        <div class="header d-flex justify-content-between align-items-center">
            <h3 class="mb-0">📊 Stats Dashboard</h3>

            <div class="d-flex gap-2">
                <button onclick="loadAll()" class="btn btn-light" id="refreshBtn">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>

                <button onclick="toggleDark()" class="btn btn-dark">
                    <i class="bi bi-moon"></i>
                </button>

                <button onclick="goBack()" class="btn btn-light">
                    <i class="bi bi-arrow-left"></i>
                </button>
            </div>
        </div>

        <!-- TOTAL REQUIREMENTS -->
        <div class="card-box">
            <h4>Total Requirements Overview</h4>
            <canvas id="totalReqChart" height="300"></canvas>
        </div>

        <!-- TOTAL OVERVIEW -->
        <div class="card-box">
            <h4>Total Overview (Managers vs Employees)</h4>
            <canvas id="totalChart" height="300"></canvas>
        </div>

        <!-- EMP PER MANAGER -->
        <div class="card-box">
            <h4>Employees per Manager</h4>
            <canvas id="empManagerChart" height="350"></canvas>
        </div>

        <!-- EMPLOYEE TYPES -->
        <div class="card-box">
            <h4>Employee Types</h4>
            <canvas id="roleChart" height="350"></canvas>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 Company Dashboard • All Rights Reserved
        </div>

    </div>

    <script>
        function toggleDark() {
            document.body.classList.toggle('dark-mode');
        }

        function goBack() {
            window.location.href = "index.html";
        }

        let totalReqChart, totalChart, empManagerChart, roleChart;

        async function loadTotalsNumbers() {
            const managerRes = await fetch("https://localhost:7192/api/employees/total-managers");
            const employeeRes = await fetch("https://localhost:7192/api/emp/total-employees");

            document.getElementById("totalManagers").innerText = await managerRes.json();
            document.getElementById("totalEmployees").innerText = await employeeRes.json();
        }

        async function loadRequirementsPie() {
            const res = await fetch("https://localhost:7192/api/customerrequirements/stats");
            const data = await res.json();

            if (totalReqChart) totalReqChart.destroy();

            totalReqChart = new Chart(document.getElementById("totalReqChart"), {
                type: 'pie',
                data: {
                    labels: data.map(x => x.status),
                    datasets: [{
                        data: data.map(x => x.count),
                        backgroundColor: ['#3A9DD2', '#00AD82', '#6BCB77', '#4D96FF']
                    }]
                }
            });
        }

        async function loadTotals() {
            const managerRes = await fetch("https://localhost:7192/api/employees/total-managers");
            const employeeRes = await fetch("https://localhost:7192/api/emp/total-employees");

            if (totalChart) totalChart.destroy();

            totalChart = new Chart(document.getElementById("totalChart"), {
                type: 'doughnut',
                data: {
                    labels: ["Managers", "Employees"],
                    datasets: [{
                        data: [await managerRes.json(), await employeeRes.json()],
                        backgroundColor: ['#3A9DD2', '#00AD82']
                    }]
                }
            });
        }

        async function loadEmpPerManager() {
            const res = await fetch("https://localhost:7192/api/employees/manager-count");
            const data = await res.json();

            if (empManagerChart) empManagerChart.destroy();

            empManagerChart = new Chart(document.getElementById("empManagerChart"), {
                type: 'bar',
                data: {
                    labels: data.map(x => x.managerName),
                    datasets: [{
                        data: data.map(x => x.count),
                        backgroundColor: ['#3A9DD2', '#00AD82'],
                        borderRadius: 6
                    }]
                }
            });
        }

        async function loadEmployeeTypes() {
            const res = await fetch("https://localhost:7192/api/emp/employee-types");
            const data = await res.json();

            if (roleChart) roleChart.destroy();

            roleChart = new Chart(document.getElementById("roleChart"), {
                type: 'bar',
                data: {
                    labels: data.map(x => x.role),
                    datasets: [{
                        data: data.map(x => x.count),
                        backgroundColor: ['#3A9DD2', '#00AD82'],
                        borderRadius: 6
                    }]
                }
            });
        }

        function loadAll() {
            document.getElementById("refreshBtn").innerHTML =
                "<i class='bi bi-hourglass-split'></i> Refreshing";

            setTimeout(() => {
                document.getElementById("refreshBtn").innerHTML =
                    "<i class='bi bi-arrow-clockwise'></i> Refresh";
            }, 800);

            loadTotalsNumbers();
            loadRequirementsPie();
            loadTotals();
            loadEmployeeTypes();
            loadEmpPerManager();
        }

        loadAll();
    </script>

</body>

</html>
