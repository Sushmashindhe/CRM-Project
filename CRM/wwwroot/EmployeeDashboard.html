<!DOCTYPE html>
<html>

<head>

    <title>Employee Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
   
    <link rel="stylesheet" href="/css/EmployeeDashboard.css">

</head>


<body class="container py-4">


    <!-- UNAUTHORIZED SCREEN -->

    <div id="unauthorizedScreen" class="unauthorized-screen">

        <div class="message-box">

            <i class="bi bi-shield-lock-fill"></i>

            <h3>Unauthorized Access</h3>

            <p>Your session is invalid.</p>

            <p>Redirecting to login page...</p>

        </div>

    </div>


    <!-- HEADER -->

    <div class="header d-flex justify-content-between align-items-center mb-4">

        <h3>
            <i class="bi bi-speedometer2"></i>
            Employee Dashboard
        </h3>

        <button onclick="logout()" class="btn btn-light">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>

    </div>


    <!-- EMPLOYEE PROFILE -->

    <div class="card p-4 mb-4">

        <h5 class="mb-3">
            <i class="bi bi-person-badge"></i>
            Your Profile
        </h5>

        <p><b>Name:</b> <span id="empName"></span></p>
        <p><b>Email:</b> <span id="empEmail"></span></p>
        <p><b>Phone:</b> <span id="empPhone"></span></p>

        <p><b>Employee Type:</b> <span id="empType"></span></p>
        <p><b>Role:</b> <span id="empRole"></span></p>
        <p><b>Manager Name:</b> <span id="empManagerId"></span></p>

    </div>


    <!-- EDIT DETAILS -->

    <div class="card p-4 mb-4">

        <h5 class="mb-3">
            <i class="bi bi-pencil-square"></i>
            Edit Your Details
        </h5>

        <div class="row g-3">

            <div class="col-md-3">
                <input id="ename" class="form-control" placeholder="Name">
            </div>

            <div class="col-md-3">
                <input id="eemail" class="form-control" placeholder="Email">
            </div>



            <div class="col-md-2">
                <input id="ephone"
                       type="tel"
                       maxlength="10"
                       class="form-control"
                       placeholder="Phone">
            </div>

            <div class="col-md-2">
                <button onclick="updateEmployee()" class="btn btn-primary w-100">
                    <i class="bi bi-save"></i> Update
                </button>
            </div>

        </div>

    </div>

    <!-- PROJECT UPDATE -->
    <div class="card p-4 mb-4">

        <div class="section-title fw-bold fs-5 mb-3 text-dark">
            <i class="bi bi-kanban"></i> Project Update
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Project Name</label>
            <input type="text"
                   id="projectName"
                   class="form-control"
                   placeholder="Enter project name">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Update Description</label>
            <textarea id="updateText"
                      rows="4"
                      class="form-control"
                      placeholder="Enter update...">
        </textarea>
        </div>

        <button onclick="sendUpdate()" class="btn btn-primary px-4">
            <i class="bi bi-send"></i> Submit Update
        </button>

    </div>


    <!-- FEEDBACK -->
    <div class="card p-4 mb-4">

        <div class="section-title">
            <i class="bi bi-chat-dots"></i> Manager Feedback
        </div>

        <div class="table-responsive">
            <table class="table table-hover">

                <thead>
                    <tr>
                        <th>Project</th>
                        <th>Your Update</th>
                        <th>Feedback</th>
                    </tr>
                </thead>

                <tbody id="employeeUpdates"></tbody>

            </table>
        </div>

    </div>

    <!-- ASSIGNED REQUIREMENTS -->
    <div class="card p-4 mb-4">
        <div class="section-title">
            <i class="bi bi-list-check"></i> Assigned Requirements
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="assignedReqTable"></tbody>
        </table>
    </div>
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert">
            <div class="d-flex">
                <div id="toastMessage" class="toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/EmployeeDashboard.js"></script>

</body>

</html>
