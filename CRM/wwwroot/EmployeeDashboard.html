<!DOCTYPE html>
<html>

<head>

    <title>Employee Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>

        body {
            background: linear-gradient(120deg,#eef2ff,#f8fafc);
            font-family: Segoe UI;
        }

        /* HEADER */

        .header {
            background: linear-gradient(135deg,#1d3557,#457b9d);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        /* CARDS */

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

            .card:hover {
                transform: translateY(-3px);
            }

        /* UNAUTHORIZED */

        .unauthorized-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .message-box {
            text-align: center;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

            .message-box i {
                font-size: 60px;
                color: #dc3545;
                margin-bottom: 15px;
            }
    </style>

</head>


<body class="container py-4">


    <!-- UNAUTHORIZED SCREEN -->

    <div id="unauthorizedScreen" class="unauthorized-screen">

        <div class="message-box">

            <i class="bi bi-shield-lock-fill"></i>

            <h3>Unauthorized Access</h3>

            <p>Your session is invalid.</p>

            <p>Redirecting to login page...</p>

        </div>

    </div>


    <!-- HEADER -->

    <div class="header d-flex justify-content-between align-items-center mb-4">

        <h3>
            <i class="bi bi-speedometer2"></i>
            Employee Dashboard
        </h3>

        <button onclick="logout()" class="btn btn-light">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>

    </div>


    <!-- EMPLOYEE PROFILE -->

    <div class="card p-4 mb-4">

        <h5 class="mb-3">
            <i class="bi bi-person-badge"></i>
            Your Profile
        </h5>

        <p><b>Name:</b> <span id="empName"></span></p>
        <p><b>Email:</b> <span id="empEmail"></span></p>
        <p><b>Employee Type:</b> <span id="empType"></span></p>
        <p><b>Role:</b> <span id="empRole"></span></p>

    </div>


    <!-- EDIT DETAILS -->

    <div class="card p-4">

        <h5 class="mb-3">
            <i class="bi bi-pencil-square"></i>
            Edit Your Details
        </h5>

        <div class="row g-3">

            <div class="col-md-3">
                <input id="ename" class="form-control" placeholder="Name">
            </div>

            <div class="col-md-3">
                <input id="eemail" class="form-control" placeholder="Email">
            </div>

            <div class="col-md-2">
                <input id="epassword" type="password" class="form-control" placeholder="Password">
            </div>

            <div class="col-md-2">
                <input id="ephone"
                       type="tel"
                       maxlength="10"
                       class="form-control"
                       placeholder="Phone">
            </div>

            <div class="col-md-2">
                <button onclick="updateEmployee()" class="btn btn-primary w-100">
                    <i class="bi bi-save"></i> Update
                </button>
            </div>

        </div>

    </div>


    <script>

        const API = "https://localhost:7192"

        const token = localStorage.getItem("token")
        const role = localStorage.getItem("role")

        /* AUTH CHECK */

        if (!token || role !== "Employee") {

            document.getElementById("unauthorizedScreen").style.display = "flex"

            setTimeout(() => {

                localStorage.clear()
                window.location.href = "login.html"

            }, 2500)

        }


        /* LOAD EMPLOYEE */

        let employeeId = null

        function loadEmployee() {

            const data = JSON.parse(localStorage.getItem("user"));

            if (!data) {
                console.log("No user found in localStorage");
                return;
            }

            const user = data.user ? data.user : data;

            employeeId = user.id;

            document.getElementById("empName").innerText = user.name;
            document.getElementById("empEmail").innerText = user.email;
            document.getElementById("empType").innerText = user.employeeType;
            document.getElementById("empRole").innerText = localStorage.getItem("role");

            document.getElementById("ename").value = user.name;
            document.getElementById("eemail").value = user.email;
        }

        /* UPDATE EMPLOYEE */

        async function updateEmployee() {

            const phone = ephone.value.trim()

            /* PHONE VALIDATION */

            const phonePattern = /^[0-9]{10}$/

            if (!phonePattern.test(phone)) {

                alert("Phone number must be exactly 10 digits")

                return

            }

            const emp = {

                name: ename.value,
                email: eemail.value,
                password: epassword.value,
                phone: phone,
                employeeType: empType.innerText,
                role: "Employee"

            }

            const res = await fetch(API + "/api/employees/" + employeeId ,{

                method: "PUT",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },

                body: JSON.stringify(emp)

            })

            if (!res.ok) {

                const text = await res.text()
                alert(text)
                return

            }

            const updated = await res.json()

            localStorage.setItem("user", JSON.stringify(updated))

            alert("Details updated successfully")

            loadEmployee()

        }


        /* LOGOUT */

        function logout() {

            localStorage.removeItem("token")
            localStorage.removeItem("role")
            localStorage.removeItem("user")

            window.location.href = "login.html"

        }


        /* INIT */

        loadEmployee()

    </script>

</body>

</html>
