<!DOCTYPE html>
<html>

<head>

    <title>CRM Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 35px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

            .logo h2 {
                font-weight: bold;
                color: #1a78b4;
            }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 18px;
        }

        .btn-login {
            background: #2d6cdf;
            border: none;
        }

            .btn-login:hover {
                background: #1e54b8;
            }

        .help-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .role-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            <h2>CRM</h2>
        </div>

        <div class="login-title">Sign In</div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="email" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control">
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
                Remember me
            </label>
        </div>

        <div class="d-grid">
            <!-- Sign In button unchanged -->
            <button onclick="login()" class="btn btn-login text-white">
                Sign In
            </button>
        </div>

        <!-- Manager & Employee buttons -->
        <div class="role-buttons">
            <button onclick="managerLogin()" class="btn btn-outline-primary w-50">
                Manager Login
            </button>

            <button onclick="employeeLogin()" class="btn btn-outline-primary w-50">
                Employee Login
            </button>
        </div>

        <div class="help-link">
            <a href="#">Forgot Password</a>
        </div>

    </div>

    <script>

        function managerLogin() {
            window.location.href = "ManagerLogin.html";
        }

        function employeeLogin() {
            window.location.href = "EmployeeLogin.html";
        }

        function login() {

            const data = {

                email: document.getElementById("email").value,
                password: document.getElementById("password").value

            };

            fetch("/api/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            })
                .then(async res => {

                    if (!res.ok) {
                        alert("Invalid login");
                        return;
                    }

                    const user = await res.json();

                    localStorage.setItem("user", JSON.stringify(user));

                    window.location.href = "dashboard.html";

                });

        }

    </script>

</body>
</html>
