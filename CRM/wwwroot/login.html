<!DOCTYPE html>
<html>
<head>
    <title>CRM System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Segoe UI, Arial;
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
            overflow: hidden;
        }
            /* subtle background bubbles */ body::before {
                content: "";
                position: absolute;
                width: 600px;
                height: 600px;
                background: rgba(255,255,255,0.08);
                border-radius: 50%;
                top: -150px;
                left: -150px;
            }

            body::after {
                content: "";
                position: absolute;
                width: 500px;
                height: 500px;
                background: rgba(255,255,255,0.05);
                border-radius: 50%;
                bottom: -200px;
                right: -120px;
            }
        /* main card */ .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            padding: 50px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            animation: float 5s ease-in-out infinite;
        }
        /* floating effect */ @keyframes float {
            0% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }

            100% {
                transform: translateY(0)
            }
        }
        /* title */ h1 {
            color: white;
            font-size: 46px;
            margin-bottom: 50px;
            letter-spacing: 1px;
            text-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        /* grid */ .button-grid {
            display: grid;
            grid-template-columns: 260px 260px;
            gap: 28px;
            margin-bottom: 30px;
        }
        /* role buttons */ .role-btn {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.25s;
            box-shadow: 0 10px 22px rgba(0,0,0,0.25);
        }

            .role-btn i {
                font-size: 24px;
            }
        /* colors */ .senior {
            background: linear-gradient(45deg,#7f4de3,#5b2bbf);
        }

        .manager {
            background: linear-gradient(45deg,#2d7df6,#1b59c6);
        }

        .employee {
            background: linear-gradient(45deg,#2dbf6e,#1c8c4d);
        }

        .customer {
            background: linear-gradient(45deg,#ff8c2b,#ff6a00);
        }
        /* hover effect */ .role-btn:hover {
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 18px 35px rgba(0,0,0,0.35);
        }
        /* back button */ .back-btn {
            margin-top: 10px;
            padding: 12px 26px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.25s;
        }

            .back-btn:hover {
                background: white;
                color: #1a78b4;
                transform: scale(1.05);
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>CRM System</h1><div class="button-grid">
            <button class="role-btn senior" onclick="location.href='SeniorManagerLogin.html'">
                <i class="bi bi-building"></i>
                Senior Manager
            </button><button class="role-btn manager" onclick="location.href='ManagerLogin.html'">
                <i class="bi bi-person-badge"></i>
                Manager
            </button><button class="role-btn employee" onclick="location.href='EmployeeLogin.html'">
                <i class="bi bi-laptop"></i>
                Employee
            </button><button class="role-btn customer" onclick="location.href='CustomerLogin.html'">
                <i class="bi bi-person"></i>
                Customer
            </button>
        </div><button class="back-btn" onclick="location.href='index.html'">
            <i class="bi bi-arrow-left"></i>
            Back to Index Page
        </button>
    </div>
</body>
</html>
