<!DOCTYPE html>
<html>

<head>

    <title>CRM System</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>

        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Segoe UI, Arial;
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
        }

        /* TITLE */

        h1 {
            color: white;
            font-size: 46px;
            margin-bottom: 60px;
            letter-spacing: 1px;
            text-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        /* GRID */

        .button-grid {
            display: grid;
            grid-template-columns: 260px 260px;
            gap: 30px;
        }

        /* BUTTON */

        .role-btn {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.25s;
            box-shadow: 0 10px 22px rgba(0,0,0,0.25);
        }

        /* COLORS */

        .senior {
            background: linear-gradient(45deg,#7f4de3,#5b2bbf);
        }

        .manager {
            background: linear-gradient(45deg,#2d7df6,#1b59c6);
        }

        .employee {
            background: linear-gradient(45deg,#2dbf6e,#1c8c4d);
        }

        .customer {
            background: linear-gradient(45deg,#ff8c2b,#ff6a00);
        }

        /* HOVER POP */

        .role-btn:hover {
            transform: translateY(-10px) scale(1.08);
            box-shadow: 0 18px 35px rgba(0,0,0,0.35);
        }

        /* ICON SIZE */

        .role-btn i {
            font-size: 24px;
        }
    </style>

</head>

<body>

    <h1>CRM System</h1>

    <div class="button-grid">

        <button class="role-btn senior" onclick="location.href='SeniorManagerLogin.html'">
            <i class="bi bi-building"></i>
            Senior Manager
        </button>

        <button class="role-btn manager" onclick="location.href='ManagerLogin.html'">
            <i class="bi bi-person-badge"></i>
            Manager
        </button>

        <button class="role-btn employee" onclick="location.href='EmployeeLogin.html'">
            <i class="bi bi-laptop"></i>
            Employee
        </button>

        <button class="role-btn customer" onclick="location.href='CustomerLogin.html'">
            <i class="bi bi-person"></i>
            Customer
        </button>

    </div>

</body>

</html>
