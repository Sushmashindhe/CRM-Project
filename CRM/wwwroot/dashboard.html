<!DOCTYPE html>
<html>

<head>
    <title>Senior Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>Senior Manager Dashboard</h2>

    <button onclick="logout()" class="btn btn-secondary mb-3">Logout</button>

    <!-- ADD MANAGER -->

    <div id="createSection">

        <h4>Add Manager</h4>

        <input id="mname" class="form-control mb-2" placeholder="Name">

        <input id="memail" class="form-control mb-2" placeholder="Email">

        <input id="mpassword" type="password" class="form-control mb-2" placeholder="Password">

        <select id="mtype" class="form-control mb-2">
            <option value="">Select Manager Type</option>
            <option value="IT Manager">IT Manager</option>
            <option value="Non IT Manager">Non IT Manager</option>
        </select>

        <button onclick="addManager()" class="btn btn-primary">
            Add Manager
        </button>

    </div>

    <hr>

    <!-- MANAGER TABLE -->

    <h3>Managers</h3>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Manager Type</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="managersTable"></tbody>

    </table>

    <script>

        const API = "https://localhost:7192";

        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user"));

        /* CHECK LOGIN */

        if (!token) {
            window.location.href = "ManagerLogin.html";
        }

        /* LOAD MANAGERS */

        async function loadManagers() {

            try {

                const res = await fetch(API + "/api/managers", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                console.log("Status:", res.status);

                if (!res.ok) {
                    const text = await res.text();
                    console.log(text);
                    throw new Error("API error");
                }

                const data = await res.json();

                let html = "";

                data.forEach(m => {

                    html += `
<tr>
<td>${m.name}</td>
<td>${m.email}</td>
<td>${m.role}</td>
<td>${m.managerType}</td>
<td>
<button onclick="deleteManager(${m.id})" class="btn btn-danger btn-sm">
Delete
</button>
</td>
</tr>
`;

                });

                document.getElementById("managersTable").innerHTML = html;

            }

            catch (err) {

                console.log(err);
                alert("Failed to load managers");

            }

        }

        /* ADD MANAGER */

        async function addManager() {

            const name = document.getElementById("mname").value;
            const email = document.getElementById("memail").value;
            const password = document.getElementById("mpassword").value;
            const managerType = document.getElementById("mtype").value;

            if (!name || !email || !password || !managerType) {

                alert("Please fill all fields");
                return;

            }

            const manager = {

                name: name,
                email: email,
                password: password,
                managerType: managerType

            };

            try {

                const response = await fetch(API + "/api/managers", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify(manager)

                });

                if (!response.ok) {

                    const text = await response.text();
                    alert("Manager not added\n" + text);
                    return;

                }

                alert("Manager added successfully");

                document.getElementById("mname").value = "";
                document.getElementById("memail").value = "";
                document.getElementById("mpassword").value = "";
                document.getElementById("mtype").value = "";

                loadManagers();

            }

            catch (error) {

                console.log(error);
                alert("Error connecting to API");

            }

        }

        /* DELETE MANAGER */

        async function deleteManager(id) {

            if (!confirm("Delete this manager?")) return;

            try {

                await fetch(API + "/api/managers/" + id, {

                    method: "DELETE",

                    headers: {
                        "Authorization": "Bearer " + token
                    }

                });

                loadManagers();

            }

            catch (err) {

                console.log(err);
                alert("Delete failed");

            }

        }

        /* LOGOUT */

        function logout() {

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            window.location.href = "ManagerLogin.html";

        }

        /* INITIAL LOAD */

        loadManagers();

    </script>

</body>
</html>
