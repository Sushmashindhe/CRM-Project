<!DOCTYPE html>
<html>

<head>

    <title>Senior Manager Dashboard</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body {
        background: #f5f7fb;
    }

    .dashboard-card {
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .profile-card {
        background: linear-gradient(135deg,#1d3557,#457b9d);
        color: white;
        border-radius: 15px;
    }
</style>

</head>

<body class="container py-5">

    <h2 class="mb-4">CRM Senior Manager Dashboard</h2>

    <!-- Senior Manager Profile -->

    <div class="card profile-card p-4 mb-4">

        <h4>Senior Manager Profile</h4>

        <p><b>Name:</b> <span id="smName">Rahul</span></p>

        <p><b>Email:</b> <span id="smEmail">senior@test.com</span></p>

        <p><b>Role:</b> <span id="smRole">Senior Manager</span></p>

    </div>

    <body class="container mt-5">

        <h2>Senior Manager Dashboard</h2>

        <h4>Add / Edit Manager</h4>

        <input id="mname" class="form-control mb-2" placeholder="Name">

        <input id="memail" class="form-control mb-2" placeholder="Email">

        <input id="mpassword" class="form-control mb-2" placeholder="Password">

        <select id="mtype" class="form-control mb-3">

            <option value="">Select Manager Type</option>

            <option value="IT Manager">IT Manager</option>

            <option value="Non IT Manager">Non IT Manager</option>

        </select>

        <button onclick="addManager()" class="btn btn-primary">
            Save Manager
        </button>

        <hr>

        <h3>Managers</h3>

        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>

                    <th>Name</th>
                    <th>Email</th>
                    <th>Password</th>
                    <th>Role</th>
                    <th>Manager Type</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="managersTable"></tbody>

        </table>

        <script>

            let managerId = null;

            /* Add OR Update manager */

            async function addManager() {

                const manager = {

                    name: document.getElementById("mname").value,
                    email: document.getElementById("memail").value,
                    password: document.getElementById("mpassword").value,
                    managerType: document.getElementById("mtype").value

                };

                let url = "/api/managers";
                let method = "POST";

                /* Update case */

                if (managerId !== null) {

                    url = "/api/managers/" + managerId;
                    method = "PUT";

                }

                await fetch(url, {

                    method: method,

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(manager)

                });

                /* reset form */

                managerId = null;

                document.getElementById("mname").value = "";
                document.getElementById("memail").value = "";
                document.getElementById("mpassword").value = "";
                document.getElementById("mtype").value = "";

                loadManagers();

            }


            /* Load managers */

            async function loadManagers() {

                const res = await fetch("/api/managers");

                const data = await res.json();

                let html = "";

                data.forEach(m => {

                    html += `

<tr>

<td>${m.name}</td>
<td>${m.email}</td>
<td>${m.password}</td>
<td>${m.role}</td>
<td>${m.managerType}</td>

<td>

<button onclick="editManager(${m.id},'${m.name}','${m.email}','${m.password}','${m.managerType}')"
class="btn btn-warning btn-sm">
Edit
</button>

<button onclick="deleteManager(${m.id})"
class="btn btn-danger btn-sm">
Delete
</button>

</td>

</tr>

`;

                });

                document.getElementById("managersTable").innerHTML = html;

            }


            /* Edit manager */

            function editManager(id, name, email, password, type) {

                document.getElementById("mname").value = name;
                document.getElementById("memail").value = email;
                document.getElementById("mpassword").value = password;
                document.getElementById("mtype").value = type;

                managerId = id;

            }


            /* Delete manager */

            async function deleteManager(id) {

                await fetch("/api/managers/" + id, {
                    method: "DELETE"
                });

                loadManagers();

            }

            loadManagers();

        </script>

    </body>

</html>
