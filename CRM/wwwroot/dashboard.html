<!DOCTYPE html>
<html>

<head>

<title>CRM Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>CRM Dashboard</h2>

<div id="createSection">

    <h4>Add Manager</h4>

    <input id="mname" class="form-control mb-2" placeholder="Name">

    <input id="memail" class="form-control mb-2" placeholder="Email">

    <input id="mpassword" type="password" class="form-control mb-2" placeholder="Password">

    <select id="mtype" class="form-control mb-2">
        <option value="">Select Manager Type</option>
        <option value="IT Manager">IT Manager</option>
        <option value="Non IT Manager">Non IT Manager</option>
    </select>

    <button onclick="addManager()" class="btn btn-primary">
        Add Manager
    </button>

    <h4>Add Employee</h4>

    <input id="ename" class="form-control mb-2" placeholder="Name">
    <input id="eemail" class="form-control mb-2" placeholder="Email">
    <input id="ephone" class="form-control mb-2" placeholder="Phone">

    <button onclick="addEmployee()" class="btn btn-success">
        Add Employee
    </button>

</div>

<hr>

<h3>Managers</h3>

<table class="table table-bordered">

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Password</th>
<th>Role</th>
<th>ManagerType</th>
<th>Action</th>
</tr>
</thead>

<tbody id="managersTable"></tbody>

</table>

<h3>Employees</h3>

<table class="table table-bordered">

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="employeesTable"></tbody>

</table>

<script>

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
window.location.href="login.html";
}

if(user.role !== "SeniorManager"){
document.getElementById("createSection").style.display="none";
}

async function loadManagers(){

const res = await fetch("/api/managers");

const data = await res.json();

let html="";

data.forEach(m=>{

let action="";

if(user.role==="SeniorManager"){
action = `<button onclick="deleteManager(${m.id})"
class="btn btn-danger btn-sm">Delete</button>`;
}

html += `
<tr>
<td>${m.name}</td>
<td>${m.email}</td>
<td>${m.password}</td>
<td>${m.role}</td>
<td>${m.managerType}</td>
<td>${action}</td>
</tr>
`;

});

document.getElementById("managersTable").innerHTML = html;

}

async function loadEmployees(){

const res = await fetch("/api/employees");

const data = await res.json();

let html="";

data.forEach(e=>{

let action="";

if(user.role==="SeniorManager"){
action = `<button onclick="deleteEmployee(${e.id})"
class="btn btn-danger btn-sm">Delete</button>`;
}

html += `
<tr>
<td>${e.name}</td>
<td>${e.email}</td>
<td>${e.phone}</td>
<td>${e.role}</td>
<td>${action}</td>
</tr>
`;

});

document.getElementById("employeesTable").innerHTML = html;

}

    async function addManager() {

        const name = document.getElementById("mname").value;
        const email = document.getElementById("memail").value;
        const password = document.getElementById("mpassword").value;
        const type = document.getElementById("mtype").value;

        const manager = {
            name: name,
            email: email,
            password: password,
            managerType: type
        };

        try {

            const response = await fetch("/api/managers", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(manager)
            });

            if (!response.ok) {
                alert("Manager not added");
                return;
            }

            alert("Manager added successfully");

            loadManagers();

        } catch (error) {

            console.log(error);
            alert("Error adding manager");

        }
    }
async function addEmployee(){

const emp = {
name: document.getElementById("ename").value,
email: document.getElementById("eemail").value,
phone: document.getElementById("ephone").value
};

await fetch("/api/employees",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(emp)

});

loadEmployees();

}

async function deleteManager(id){

await fetch("/api/managers/"+id,{
method:"DELETE"
});

loadManagers();

}

async function deleteEmployee(id){

await fetch("/api/employees/"+id,{
method:"DELETE"
});

loadEmployees();

}

loadManagers();
loadEmployees();

</script>

</body>
</html>
