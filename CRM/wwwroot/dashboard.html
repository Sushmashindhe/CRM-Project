<!DOCTYPE html>
<html>

<head>
    <title>Senior Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>Senior Manager Dashboard</h2>

    <button onclick="logout()" class="btn btn-secondary mb-3">Logout</button>

    <!-- ADD MANAGER -->

    <div>

        <h4>Add Manager</h4>

        <input id="mname" class="form-control mb-2" placeholder="Name">
        <input id="memail" class="form-control mb-2" placeholder="Email">
        <input id="mpassword" type="password" class="form-control mb-2" placeholder="Password">

        <select id="mtype" class="form-control mb-2">
            <option value="">Select Manager Type</option>
            <option value="IT Manager">IT Manager</option>
            <option value="Non IT Manager">Non IT Manager</option>
        </select>

        <button id="saveBtn" onclick="saveManager()" class="btn btn-primary">
            Add Manager
        </button>

    </div>

    <hr>

    <h3>Managers</h3>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Manager Type</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="managersTable"></tbody>

    </table>

    <script>

        let editManagerId = null;

        const API = "https://localhost:7192";

        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        /* =========================
        AUTH CHECK
        ========================= */

        if (!token || role !== "SeniorManager") {

            alert("Unauthorized access");
            window.location.replace("login.html");
            throw new Error("Unauthorized");

        }

        /* =========================
        LOAD MANAGERS
        ========================= */

        async function loadManagers() {

            try {

                const res = await fetch(API + "/api/managers", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (res.status === 401) {
                    alert("Session expired. Please login again.");
                    logout();
                    return;
                }

                const data = await res.json();

                let html = "";

                data.forEach(m => {

                    html += `
<tr>
<td>${m.name}</td>
<td>${m.email}</td>
<td>${m.role}</td>
<td>${m.managerType}</td>
<td>
<button onclick="deleteManager(${m.id})" class="btn btn-danger btn-sm">
Delete
</button>
<button class="btn btn-warning btn-sm"
onclick="editManager(${m.id},'${m.name}','${m.email}','${m.managerType}')">
 
<i class="bi bi-pencil"></i> Edit
 
</button>
</td>
</tr>
`;

                });

                document.getElementById("managersTable").innerHTML = html;

            }
            catch (error) {

                console.log(error);
                alert("Failed to load managers");

            }

        }

        /* =========================
        ADD MANAGER
        ========================= */

        async function saveManager() {

            const name = document.getElementById("mname").value;
            const email = document.getElementById("memail").value;
            const password = document.getElementById("mpassword").value;
            const managerType = document.getElementById("mtype").value;

            if (!name || !email || !managerType) {
                alert("Please fill required fields");
                return;
            }

            const manager = {
                name: name,
                email: email,
                password: password,
                managerType: managerType
            };

            try {

                let url = API + "/api/managers";
                let method = "POST";

                // UPDATE
                if (editManagerId !== null) {
                    url = API + "/api/managers/" + editManagerId;
                    method = "PUT";
                }

                const res = await fetch(url, {

                    method: method,

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify(manager)

                });

                if (!res.ok) {
                    const text = await res.text();
                    alert(text);
                    return;
                }

                alert(editManagerId ? "Manager updated successfully" : "Manager added successfully");

                clearForm();
                loadManagers();

            }
            catch (error) {

                console.log(error);
                alert("Error connecting to API");

            }
        }

        function editManager(id, name, email, type) {

            editManagerId = id;

            document.getElementById("mname").value = name;
            document.getElementById("memail").value = email;
            document.getElementById("mtype").value = type;

            document.getElementById("saveBtn").innerText = "Update Manager";

        }

        function clearForm() {

            editManagerId = null;

            document.getElementById("mname").value = "";
            document.getElementById("memail").value = "";
            document.getElementById("mpassword").value = "";
            document.getElementById("mtype").value = "";

            document.getElementById("saveBtn").innerText = "Add Manager";

        }

        /* =========================
        DELETE MANAGER
        ========================= */

        async function deleteManager(id) {

            if (!confirm("Delete this manager?")) return;

            try {

                const res = await fetch(API + "/api/managers/" + id, {

                    method: "DELETE",

                    headers: {
                        "Authorization": "Bearer " + token
                    }

                });

                if (!res.ok) {
                    alert("Delete failed");
                    return;
                }

                loadManagers();

            }
            catch (error) {

                console.log(error);
                alert("Delete failed");

            }

        }

        /* =========================
        LOGOUT
        ========================= */

        function logout() {

            localStorage.clear();
            window.location.href = "login.html";

        }

        /* =========================
        INITIAL LOAD
        ========================= */

        loadManagers();

    </script>

</body>
</html>
