<!DOCTYPE html>
<html>

<head>

    <title>Customer Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/CustomerLogin.css">

</head>

<body>

    <div class="login-card">

        <div class="logo">
            <h2>CRM</h2>
        </div>

        <div class="login-title">Customer Sign In</div>

        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input id="email" class="form-control">

            <div id="emailError" class="error-text">
                Please enter a valid email (must contain @)
            </div>

        </div>

        <!-- PASSWORD -->

        <div class="mb-3">

            <label class="form-label">Password</label>

            <input id="password" type="password" class="form-control">

            <div id="passwordError" class="error-text">
                Password must contain 8+ characters
            </div>

        </div>

        <!-- LOGIN ERROR -->

        <div id="loginError" class="alert alert-danger" style="display:none;">
            Invalid email or password
        </div>

        <!-- LOGIN BUTTON -->

        <div class="d-grid">

            <button onclick="login()" class="btn btn-login text-white">
                Login
            </button>

        </div>

        <div class="help-link">
            New Customer? <a href="CustomerRegister.html">Register here</a>
        </div>

    </div>

    <script src="/js/CustomerLogin.js"></script>

</body>
</html>
