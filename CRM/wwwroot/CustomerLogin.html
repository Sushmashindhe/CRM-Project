<!DOCTYPE html>
<html>

<head>

    <title>Customer Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 35px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

            .logo h2 {
                font-weight: bold;
                color: #1a78b4;
            }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 18px;
        }

        .btn-login {
            background: #2d6cdf;
            border: none;
        }

            .btn-login:hover {
                background: #1e54b8;
            }

        .help-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .error-text {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            <h2>CRM</h2>
        </div>

        <div class="login-title">Customer Sign In</div>

        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input id="email" class="form-control">

            <div id="emailError" class="error-text">
                Please enter a valid email (must contain @)
            </div>

        </div>

        <!-- PASSWORD -->

        <div class="mb-3">

            <label class="form-label">Password</label>

            <input id="password" type="password" class="form-control">

            <div id="passwordError" class="error-text">
                Password must contain 8+ characters
            </div>

        </div>

        <!-- LOGIN ERROR -->

        <div id="loginError" class="alert alert-danger" style="display:none;">
            Invalid email or password
        </div>

        <!-- LOGIN BUTTON -->

        <div class="d-grid">

            <button onclick="login()" class="btn btn-login text-white">
                Login
            </button>

        </div>

        <div class="help-link">
            New Customer? <a href="CustomerRegister.html">Register here</a>
        </div>

    </div>

    <script>
        const API = "https://localhost:7192";

        async function login() {

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");
            const loginError = document.getElementById("loginError");

            emailError.style.display = "none";
            passwordError.style.display = "none";
            loginError.style.display = "none";

            if (!email.includes("@")) {
                emailError.style.display = "block";
                return;
            }

            if (password.length < 8) {
                passwordError.style.display = "block";
                return;
            }

            const res = await fetch(API + "/api/customers/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            if (!res.ok) {
                loginError.style.display = "block";
                return;
            }

            const result = await res.json();

            console.log("LOGIN RESPONSE:", result);

            // ✅ STORE USER
            localStorage.setItem("user", JSON.stringify(result));

            // ✅ REDIRECT
            window.location.href = "CustomerDashboard.html";
        }
    </script>

</body>
</html>
