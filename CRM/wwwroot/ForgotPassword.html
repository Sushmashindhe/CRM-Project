<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: linear-gradient(135deg,#2cc1a6,#1e6fa8);
        }

        .box {
            background: white;
            padding: 40px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2f63d8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #resetSection {
            display: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Reset Password</h2>

        <input id="email" placeholder="Enter your email">

        <input id="placeofbirth" placeholder="Enter Place Of Birth">

        <!-- ADDED ROLE SELECTION -->
        <select id="role">
            <option value="Employee">Employee</option>
            <option value="Manager">Manager</option>
        </select>

        <button onclick="verifyUser()">Verify</button>


        <div id="resetSection">

            <input id="newPassword" type="password" placeholder="New Password">

            <input id="confirmPassword" type="password" placeholder="Confirm Password">

            <button onclick="resetPassword()">Change Password</button>

        </div>

    </div>

    <script>

        const API = "https://localhost:7192";

        let verifiedEmail = "";

        let verifiedRole = "";   // ADDED

        async function verifyUser() {

            const email = document.getElementById("email").value.trim();

            const placeOfBirth = document.getElementById("placeofbirth").value.trim();

            const role = document.getElementById("role").value;  // ADDED

            const res = await fetch(API + "/api/auth/verify-placeofbirth", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    email: email,

                    placeOfBirth: placeOfBirth,

                    role: role   // ADDED

                })

            });

            if (!res.ok) {

                alert("Email or Place Of Birth incorrect");

                return;

            }

            verifiedEmail = email;

            verifiedRole = role;   // ADDED

            document.getElementById("resetSection").style.display = "block";

            alert("Verification successful. Enter new password.");

        }


        async function resetPassword() {

            const newPassword = document.getElementById("newPassword").value;

            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {

                alert("Passwords do not match");

                return;

            }

            const res = await fetch(API + "/api/auth/reset-password", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    email: verifiedEmail,

                    newPassword: newPassword

                })

            });

            if (!res.ok) {

                const text = await res.text();

                alert(text);

                return;

            }

            alert("Password successfully changed.");

            // ADDED REDIRECT BASED ON ROLE

            if (verifiedRole === "Manager") {

                window.location.href = "ManagerLogin.html";

            } else {

                window.location.href = "EmployeeLogin.html";

            }

        }

    </script>

</body>
</html>
