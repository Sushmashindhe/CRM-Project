<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg,#2cc1a6,#1e6fa8);
        }

        /* Card */

        .box {
            width: 320px;
            padding: 30px 35px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* Title */

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Inputs */

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            box-sizing: border-box;
        }

            input:focus {
                border-color: #2cc1a6;
                outline: none;
                box-shadow: 0 0 5px rgba(44,193,166,0.5);
            }

        /* Button */

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            color: white;
            background: #3b6ed0; /* solid blue */
            cursor: pointer;
            transition: 0.3s;
        }

            button:hover {
                background: #2f63d8; /* darker blue on hover */
            }

        #resetSection {
            display: none;
            margin-top: 10px;
        }

        /* Message */

        .msg {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>

</head>

<body>

    <div class="box">

        <h2>Reset Password</h2>

        <input id="email" placeholder="Enter your email">

        <input id="placeofbirth" placeholder="Enter Place Of Birth">

        <button onclick="verifyUser()">Verify</button>

        <div id="resetSection">

            <input id="newPassword" type="password" placeholder="New Password">

            <input id="confirmPassword" type="password" placeholder="Confirm Password">

            <button onclick="resetPassword()">Change Password</button>

        </div>

        <div id="message" class="msg"></div>

    </div>

    <script>

        const API = "https://localhost:7192";

        let verifiedEmail = "";

        /* Message function */

        function showMessage(text, type) {

            const msg = document.getElementById("message");

            msg.innerText = text;

            msg.className = "msg " + type;

        }

        /* Verify User */

        async function verifyUser() {

            const email = document.getElementById("email").value.trim();

            const placeOfBirth = document.getElementById("placeofbirth").value.trim();

            if (!email || !placeOfBirth) {

                showMessage("Please enter email and place of birth", "error");

                return;

            }

            const res = await fetch(API + "/api/auth/verify-placeofbirth", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    placeOfBirth: placeOfBirth

                })

            });

            if (!res.ok) {

                showMessage("Email or Place Of Birth incorrect", "error");

                return;

            }

            verifiedEmail = email;

            document.getElementById("resetSection").style.display = "block";

            showMessage("Verification successful. Enter new password.", "success");

        }

        /* Reset Password */

        async function resetPassword() {

            const newPassword = document.getElementById("newPassword").value;

            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {

                showMessage("Passwords do not match", "error");

                return;

            }

            const res = await fetch(API + "/api/auth/reset-password", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: verifiedEmail,

                    newPassword: newPassword

                })

            });

            if (!res.ok) {

                showMessage("Failed to change password", "error");

                return;

            }

            showMessage("Password successfully changed", "success");

        }

    </script>

</body>

</html>
