<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2cc1a6, #1e6fa8);
        }

        .box {
            background: white;
            padding: 35px 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

            .box h2 {
                margin-bottom: 25px;
                color: #333;
            }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

            input:focus,
            select:focus {
                border-color: #2f63d8;
                box-shadow: 0 0 5px rgba(47, 99, 216, 0.3);
            }

        button {
            width: 100%;
            padding: 12px;
            background: #2f63d8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

            button:hover {
                background: #244fb3;
            }

        #resetSection {
            display: none;
            margin-top: 10px;
        }

        /* message styles */
        .message {
            font-size: 13px;
            margin-top: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .passwordBtn {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Reset Password</h2>

        <input id="email" placeholder="Enter your email">
        <input id="placeofbirth" placeholder="Enter Place Of Birth">

        <select id="role">
            <option value="Employee">Employee</option>
            <option value="Manager">Manager</option>
        </select>

        <!-- verification message -->
        <p id="verifyMessage" class="message"></p>

        <button onclick="verifyUser()">Verify</button>

        <div id="resetSection">
            <input id="newPassword" type="password" placeholder="New Password">
            <input id="confirmPassword" type="password" placeholder="Confirm Password">

            <button class="passwordBtn" onclick="resetPassword()">
                Change Password
            </button>

            <p id="passwordMessage" class="message"></p>
        </div>
    </div>

    <script>
        const API = "https://localhost:7192";

        let verifiedEmail = "";
        let verifiedRole = "";

        async function verifyUser() {
            const email = document.getElementById("email").value.trim();
            const placeOfBirth = document.getElementById("placeofbirth").value.trim();
            const role = document.getElementById("role").value;
            const message = document.getElementById("verifyMessage");

            const res = await fetch(API + "/api/auth/verify-placeofbirth", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    placeOfBirth: placeOfBirth,
                    role: role
                })
            });

            if (!res.ok) {
                message.style.display = "block";
                message.className = "message error";
                message.innerText = "Email or Place Of Birth incorrect";
                return;
            }

            message.style.display = "block";
            message.className = "message success";
            message.innerText = "Verification successful";

            verifiedEmail = email;
            verifiedRole = role;

            document.getElementById("resetSection").style.display = "block";
        }

        async function resetPassword() {
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const passwordMsg = document.getElementById("passwordMessage");

            if (newPassword !== confirmPassword) {
                passwordMsg.style.display = "block";
                passwordMsg.className = "message error";
                passwordMsg.innerText = "Passwords do not match";
                return;
            }

            const res = await fetch(API + "/api/auth/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: verifiedEmail,
                    newPassword: newPassword
                })
            });

            if (!res.ok) {
                const text = await res.text();
                passwordMsg.style.display = "block";
                passwordMsg.className = "message error";
                passwordMsg.innerText = text;
                return;
            }

            passwordMsg.style.display = "block";
            passwordMsg.className = "message success";
            passwordMsg.innerText = "Password successfully changed.";

            setTimeout(() => {
                if (verifiedRole === "Manager") {
                    window.location.href = "ManagerLogin.html";
                } else {
                    window.location.href = "EmployeeLogin.html";
                }
            }, 2000);
        }
    </script>

</body>

</html>
