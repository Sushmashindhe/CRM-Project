<!DOCTYPE html>
<html>

<head>

    <title>Employee Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 35px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

            .logo h2 {
                font-weight: bold;
                color: #1a78b4;
            }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 18px;
        }

        .btn-login {
            background: #2d6cdf;
            border: none;
        }

            .btn-login:hover {
                background: #1e54b8;
            }

        .help-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .error-text {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            <h2>CRM</h2>
        </div>

        <div class="login-title">Employee Sign In</div>

        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input id="email" class="form-control">

            <div id="emailError" class="error-text">

                Please enter a valid email (must contain @)
            </div>

        </div>

        <!-- PASSWORD -->

        <div class="mb-3">

            <label class="form-label">Password</label>

            <input id="password" type="password" class="form-control">

            <div id="passwordError" class="error-text">

                Password must contain 8+ characters, uppercase, lowercase, number and special character
            </div>

        </div>

        <!-- LOGIN ERROR -->

        <div id="loginError" class="alert alert-danger" style="display:none;">

            Invalid email or password
        </div>

        <!-- LOGIN BUTTON -->

        <div class="d-grid">

            <button onclick="login()" class="btn btn-login text-white">

                Login
            </button>

        </div>

        <div class="help-link">
            <a href="ForgotPassword.html">Forgot Password?</a>
        </div>

    </div>

    <script>

        const API = "https://localhost:7192";

        localStorage.removeItem("token");
        localStorage.removeItem("role");
        localStorage.removeItem("user");

        async function login() {

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");
            const loginError = document.getElementById("loginError");

            emailError.style.display = "none";
            passwordError.style.display = "none";
            loginError.style.display = "none";

            /* EMAIL VALIDATION */

            if (!email.includes("@")) {

                emailError.style.display = "block";
                return;

            }

            /* PASSWORD VALIDATION */

            const strongPassword =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

            if (!strongPassword.test(password)) {

                passwordError.style.display = "block";
                return;

            }

            const data = {
                email: email,
                password: password
            };

            /* API LOGIN */

            const res = await fetch(API + "/api/auth/login", {

                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)

            });

            if (!res.ok) {

                loginError.style.display = "block";
                return;

            }

            const user = await res.json();

            localStorage.setItem("token", user.token);
            localStorage.setItem("role", user.role);

            localStorage.setItem("user", JSON.stringify({
                id: user.id,
                name: user.name,
                email: user.email,
                employeeType: user.employeeType,
                role: user.role
            }));

            window.location.href = "EmployeeDashboard.html";
        }

    </script>

</body>
</html>
