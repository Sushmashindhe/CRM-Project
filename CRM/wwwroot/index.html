<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background: linear-gradient(90deg,#23c4a7,#1a78b4);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* CARD */

        .home-card {
            width: 420px;
            padding: 45px 40px;
            border-radius: 12px;
            background: white;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

            /* TITLE */

            .home-card h1 {
                color: #1a78b4;
                font-weight: bold;
                font-size: 38px;
                margin-bottom: 10px;
            }

        /* TAGLINE */

        .tagline {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }

        /* BUTTON GROUP */

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* BUTTONS */

        .btn-login {
            background: #2d6cdf;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            width: 120px;
            transition: all 0.25s ease;
        }

            .btn-login:hover {
                background: #1e54b8;
                transform: translateY(-4px) scale(1.05);
                box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            }

        .btn-register {
            background: #28a745;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            width: 120px;
            transition: all 0.25s ease;
        }

            .btn-register:hover {
                background: #1e7e34;
                transform: translateY(-4px) scale(1.05);
                box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            }
    </style>

</head>

<body>

    <div class="home-card">

        <h1>CRM System</h1>

        <p class="tagline">
            Smarter CRM for Better Business Growth
        </p>

        <div class="button-group">

            <a href="login.html" class="btn btn-login text-white">
                Login
            </a>
            <a href="CustomerRegister.html" class="btn btn-login text-white">
                Register
            </a>



        </div>

    </div>

</body>
</html>
